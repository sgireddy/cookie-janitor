[project]
name = "cookie-janitor"
version = "0.5.1"
description = "A transparent, open-source helper that shows you every cookie on your machine, explains why it's there, and lets you decide what to keep."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "The cookie-janitor contributors" }]
requires-python = ">=3.11"
keywords = ["cookies", "privacy", "browser", "tracker", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Security",
]
dependencies = [
    # Cookie store discovery + decryption across browsers/OSes.
    # 0 known CVEs / GHSA / OSV as of project scaffolding.
    "browser-cookie3>=0.20.1,<0.21",
    # Transitive of browser-cookie3, but pinned past CVE-fixed-in-3.19.1
    # (Manger-attack OAEP side-channel; not on a path we use, but pinned).
    "pycryptodomex>=3.19.1,<4",
    # Detect running browsers; refuse to operate on a live profile.
    "psutil>=5.9,<7",
    # Config and IPC payload validation.
    "pydantic>=2.7,<3",
    # CLI framework.
    "typer>=0.12,<1",
    # Rich terminal output for the CLI.
    "rich>=13.7,<15",
    # YAML for the user config file (allow-list, policy).
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
# GUI extra. We keep PySide6 out of the base install so headless / CLI-only
# users don't pull in ~80 MB of Qt. The desktop app installer always
# bundles this extra.
#
# PySide6 is LGPL-3.0. We ship it as a dynamically-linked component of an
# Apache-2.0 application; users may replace the Qt libraries inside the
# .app bundle. The bundled COPYING.LGPLv3 covers our redistribution.
gui = [
    "PySide6>=6.7,<7",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "PySide6>=6.7,<7",
]

[project.scripts]
cookie-janitor = "cookie_janitor.cli:app"

[project.gui-scripts]
cookie-janitor-gui = "cookie_janitor.gui.app:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "S",             # flake8-bandit
    "UP",            # pyupgrade
    "SIM",           # flake8-simplify
    "RET",           # flake8-return
    "PTH",           # flake8-use-pathlib
    "TID",           # flake8-tidy-imports
    "RUF",           # ruff-specific
]
ignore = [
    "S101",  # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true

# Platform-shim modules contain code that is reachable on only some
# platforms (Windows-only ctypes calls, POSIX-only `os.O_DIRECTORY` /
# `os.getuid`). On any single mypy host, half the file is unreachable
# and half of its `# type: ignore` comments are "unused". Both are
# intended; relax those two checks for these files only.
[[tool.mypy.overrides]]
module = [
    "cookie_janitor.safety.privilege",
    "cookie_janitor.safety.fs",
]
warn_unreachable = false
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.bandit]
exclude_dirs = ["tests"]

# ---------------------------------------------------------------------------
# Briefcase: turn the GUI into a macOS .app and DMG.
# https://briefcase.readthedocs.io
#
# We deliberately do NOT pull these dependencies into the wheel install
# matrix; briefcase reads this block only when invoked as `briefcase ...`.
# ---------------------------------------------------------------------------

[tool.briefcase]
project_name = "Cookie Janitor"
bundle = "dev.cookiejanitor"
version = "0.5.1"
url = "https://github.com/sgireddy/cookie-janitor"
license.file = "LICENSE"
author = "Shashi Gireddy"
author_email = "3526482+sgireddy@users.noreply.github.com"

[tool.briefcase.app.cookie_janitor]
formal_name = "Cookie Janitor"
description = "See every cookie on your machine, why it's there, and decide what to keep."
long_description = """
Cookie Janitor is an open-source desktop helper that classifies every
cookie in your browser using the Open Cookie Database and shows you
the reason for each recommendation. You decide what to delete. The app
never sends your cookies anywhere, makes a verified backup before any
deletion, and refuses to operate while your browser is running.
"""
sources = ["src/cookie_janitor"]
test_sources = ["tests"]

# Runtime dependencies for the bundled app. Mirrors the [project]
# dependency block plus PySide6 (the GUI extra).
requires = [
    "browser-cookie3>=0.20.1,<0.21",
    "pycryptodomex>=3.19.1,<4",
    "psutil>=5.9,<7",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "ruamel.yaml>=0.18,<0.19",
    "PySide6>=6.7,<7",
]

[tool.briefcase.app.cookie_janitor.macOS]
# Universal2 wheels mean a single x86_64 build can ship a universal app
# in principle, but briefcase still produces per-arch artifacts. We let
# the CI matrix do both arm64 and x86_64.
universal_build = false
requires = []
# Ad-hoc sign by default; CI will switch to a real Developer ID if the
# DEVELOPER_ID_APPLICATION secret is set.
[tool.briefcase.app.cookie_janitor.macOS.app]
template = "https://github.com/beeware/briefcase-macOS-app-template"
