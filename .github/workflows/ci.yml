name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    name: lint, type-check, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install Qt runtime libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Ruff (format)
        run: uv run ruff format --check src tests

      - name: Mypy (strict)
        run: uv run mypy --strict src

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

  security:
    name: security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Bandit (SAST)
        run: uv run bandit -q -r src

      - name: pip-audit (CVE scan)
        # --skip-editable so pip-audit doesn't try to look our own package
        # up on PyPI (it isn't published yet and that's an error in --strict).
        run: uv run pip-audit --strict --skip-editable

      - name: Verify no secrets in tree
        run: |
          ! grep -RInE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{30,})' src tests
