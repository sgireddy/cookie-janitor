name: Release

# Build the macOS .app + .dmg for tagged releases (`v*`), and also on a
# manual workflow_dispatch so we can produce unsigned development builds
# without cutting a tag.
#
# What this workflow guarantees:
#   * One DMG per macOS arch (arm64 + x86_64, delivered as a single
#     universal2 fat binary), built on the matching runner so the
#     bundled Qt binaries are native.
#   * macOS DMG is code-signed with a Developer ID Application
#     certificate and notarized by Apple whenever the signing secrets
#     are present. Falls back to ad-hoc signing on forks and on
#     workflow_dispatch runs from environments without secret access,
#     so the workflow remains usable for development builds.
#   * SHA-256 sums published next to the DMGs and MSIs so users can
#     verify what they downloaded matches what CI produced.
#   * SLSA build-provenance attestations recorded in GitHub's public
#     transparency log for supply-chain verification via
#     `gh attestation verify`.
#   * A draft GitHub Release is created on tag pushes; a maintainer
#     publishes it after a quick smoke test.
#
# Signing secrets — see docs/SIGNING-MACOS.md for the full spec:
#   MACOS_CERTIFICATE_P12_BASE64     Developer ID Application .p12 (base64)
#   MACOS_CERTIFICATE_PASSWORD       .p12 export password
#   MACOS_KEYCHAIN_PASSWORD          ephemeral CI keychain password
#   MACOS_DEVELOPER_ID_APPLICATION   cert Common Name (used as --identity)
#   MACOS_NOTARY_KEY_P8_BASE64       App Store Connect API key (base64)
#   MACOS_NOTARY_KEY_ID              ASC API Key ID (10 chars)
#   MACOS_NOTARY_ISSUER_ID           ASC API Issuer ID (UUID)
#   MACOS_TEAM_ID                    Developer Team ID (10 chars)
#
# The workflow only writes inside the runner. The single write outside
# the runner is `softprops/action-gh-release`, which requires the
# default GITHUB_TOKEN with `contents: write` — declared explicitly.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name for the resulting draft release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # If a newer release run for the same ref starts, abandon the older one.
  # Releases are idempotent (artifacts are derived from the ref, draft
  # release is upserted by tag_name) so superseding is safe and avoids
  # the queue-pileup we saw when an Intel runner sat queued for hours.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = Apple Silicon (arm64) hosted runner. From this
          # single runner we build a **universal2** DMG that contains
          # both arm64 AND x86_64 slices in one Mach-O fat binary — so
          # Intel Macs (2017–2019 MacBook Pros, 2020 iMacs, etc.) and
          # every Apple Silicon Mac run the same artefact.
          #
          # Mechanism: `universal_build = true` in pyproject.toml under
          # `[tool.briefcase.app.cookie_janitor.macOS]`. Briefcase then
          # pip-installs every dependency twice (once per arch) and
          # `lipo -create`s the resulting .dylib pairs into fat binaries.
          #
          # NB: earlier revisions of this file set an env var
          # `BRIEFCASE_MACOS_APP_UNIVERSAL_BUILD=true` here, believing it
          # would override the TOML. Briefcase doesn't read that env var
          # — TOML always wins — so from v0.7.1 through v0.8.4 the CI
          # actually produced arm64-thin builds despite the "universal2"
          # filename. That was the RCA for the "not supported on this
          # Mac" launch failure. See docs/SIGNING-MACOS.md § history.
          #
          # We no longer need the macos-13 (Intel) runner — a real
          # universal2 build from macos-14 covers Intel too, and macos-13
          # was retired by GitHub anyway.
          - runner: macos-14
            arch: universal2
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # briefcase reads tags for version metadata

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (dev + gui)
        run: uv sync --extra dev --extra gui --frozen

      - name: Install briefcase
        run: uv pip install "briefcase>=0.3.20,<0.4"

      - name: Detect signing availability
        # Signing needs all 8 secrets. In forks (PRs from third parties),
        # or on workflow_dispatch runs without secret access, the P12
        # secret is empty — we fall back to ad-hoc signing so the
        # workflow still produces a runnable (but unsigned) DMG.
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing: ENABLED (Developer ID + notarization)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing: DISABLED (ad-hoc fallback)"
          fi

      - name: Import Developer ID certificate into temporary keychain
        # Create an ephemeral keychain scoped to this run, import the
        # Developer ID Application cert + private key, and prepend it to
        # the search list so `codesign` finds the identity. The keychain
        # is deleted at the end of the job in the Cleanup step below.
        #
        # `set-key-partition-list` with the apple-tool: and codesign:
        # partitions is what silences the "codesign wants to access key
        # in your keychain" GUI prompt that would otherwise stall CI.
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          printf '%s' "$P12_B64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"

          security import "$P12_PATH" -k "$KEYCHAIN" -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN"

          # Prepend our keychain to the search list so codesign finds it
          # before the default login/System keychains.
          existing="$(security list-keychains -d user | sed 's/[" ]//g' | tr '\n' ' ')"
          security list-keychains -d user -s "$KEYCHAIN" $existing

          # Shrink exposure window: cert is now in the ephemeral keychain,
          # the on-disk .p12 is no longer needed.
          rm -f "$P12_PATH"

          # Confirm the identity is findable by name (sanity check —
          # briefcase --identity would fail with an opaque error otherwise).
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Briefcase create + build
        run: |
          uv run briefcase create macOS app --no-input
          uv run briefcase build macOS app --no-input

      - name: Briefcase package (signed or ad-hoc)
        # With --identity, briefcase 0.3.20+ signs the .app bundle plus
        # every nested binary (Python framework, Qt frameworks, C
        # extensions) with the Developer ID cert and enables the
        # hardened runtime — both are prerequisites for notarization.
        # Without --identity, --adhoc-sign produces an unsigned but
        # launchable bundle for local development.
        #
        # --no-notarize is critical for CI: briefcase's built-in
        # notarization looks up credentials via a stored keychain
        # profile named `briefcase-macOS-<TEAM_ID>` that would need
        # `xcrun notarytool store-credentials` run interactively. In CI
        # we do notarization ourselves in a later step using the
        # App Store Connect .p8 key straight from secrets, which is
        # the credential shape Apple's notarization API actually wants
        # and which works headlessly. This flag disables briefcase's
        # attempt so control passes cleanly to our step.
        env:
          IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            uv run briefcase package macOS app --no-input --identity "$IDENTITY" --no-notarize
          else
            uv run briefcase package macOS app --adhoc-sign --no-input
          fi

      - name: Locate built DMG
        id: locate
        run: |
          set -euo pipefail
          dmg="$(find dist -name '*.dmg' -print -quit)"
          if [ -z "${dmg}" ]; then
            echo "No DMG produced by briefcase" >&2
            exit 1
          fi
          renamed="dist/Cookie-Janitor-${{ matrix.arch }}.dmg"
          mv "${dmg}" "${renamed}"
          echo "dmg=${renamed}" >> "$GITHUB_OUTPUT"

      - name: Assert the .app is genuinely universal2
        # Guardrail against the v0.7.1–v0.8.4 phantom: for two months we
        # shipped DMGs named "-universal2" containing arm64-thin apps
        # because `universal_build` in pyproject.toml was false and a
        # phantom env var was believed to override it. This step fails
        # the build if `codesign -dvv` on the built .app doesn't report
        # a fat binary, and independently `lipo -info` on both the main
        # executable and a critical PySide6 .dylib.
        if: matrix.arch == 'universal2'
        run: |
          set -euo pipefail
          app="$(find build -type d -name 'Cookie Janitor.app' -path '*/macos/app/*' | head -1)"
          [ -n "${app}" ] || { echo "no built .app found" >&2; exit 1; }
          echo "Checking: ${app}"
          fmt="$(codesign -dvv "${app}" 2>&1 | grep '^Format=')"
          echo "  ${fmt}"
          case "${fmt}" in
            *"Mach-O universal"*) ;;
            *) echo "FAIL: main executable is not universal2 — got: ${fmt}" >&2; exit 1 ;;
          esac
          assert_fat() {
            local label="$1" binary="$2" info
            info="$(lipo -info "${binary}" 2>&1)"
            echo "  ${label}: ${info}"
            if ! echo "${info}" | grep -q 'x86_64'; then
              echo "FAIL: ${label} missing x86_64 slice" >&2
              exit 1
            fi
            if ! echo "${info}" | grep -q 'arm64'; then
              echo "FAIL: ${label} missing arm64 slice" >&2
              exit 1
            fi
          }
          assert_fat "main  " "${app}/Contents/MacOS/Cookie Janitor"
          qtcore="$(find "${app}" -path '*PySide6*QtCore.framework/Versions/A/QtCore' | head -1)"
          if [ -n "${qtcore}" ]; then
            assert_fat "QtCore" "${qtcore}"
          fi
          echo "PASS: .app is genuinely universal2"

      - name: Notarize and staple .app and DMG
        # Two-round notarize+staple. Stapling ONLY the DMG (round 2) isn't
        # enough on macOS 15+ — when a user mounts the DMG and launches the
        # .app straight from the mounted volume (or drags it to
        # /Applications), Gatekeeper looks for a stapled ticket on the
        # .app itself, not on the enclosing DMG. Without one, it falls
        # back to an online check that can fail with the misleading
        # "not supported on this Mac" error.
        #
        # The fix is Apple's documented pattern: staple BOTH artifacts.
        #
        # Round 1: notarize the .app zipped up (briefcase left it signed
        # but unstapled in the build directory), then `stapler staple`
        # the .app in place.
        # Rebuild:  build a fresh DMG from scratch with `hdiutil create
        # -srcfolder` around a staging directory containing the stapled
        # .app + an `/Applications` symlink. Discards briefcase's DMG.
        # (Earlier v0.8.2 attempt tried `hdiutil convert -format UDRW`
        # then mount-and-replace, but the RW DMG's filesystem had no
        # free space for the copy, so cp failed with "No space left on
        # device". Fresh DMG from scratch avoids the problem entirely.)
        # Round 2: notarize the new DMG (fast — Apple recognizes the
        # already-notarized .app inside), then staple the DMG.
        #
        # Trade-off: briefcase's fancy background image + window layout
        # is lost. The DMG becomes a plain Finder view — .app on the
        # left, /Applications symlink on the right. Users drag to
        # install. Correctness over polish; polish can return in a
        # later release.
        #
        # After both stapled, `spctl -a -t install` and
        # `spctl -a -t exec` confirm Gatekeeper acceptance from both
        # perspectives (installing the DMG and executing the .app).
        if: steps.signing.outputs.enabled == 'true'
        env:
          P8_B64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          DMG: ${{ steps.locate.outputs.dmg }}
          # The Developer ID identity is needed here (in addition to the
          # Briefcase package step) because `hdiutil create` produces an
          # unsigned DMG; we sign it ourselves with `codesign` before
          # Round 2 notarize. spctl -a -t install requires the DMG itself
          # to carry a Developer ID signature — a notarization ticket
          # alone isn't enough.
          IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail

          P8_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s' "$P8_B64" | base64 --decode > "$P8_PATH"

          # Shared notarization helper: submit + wait + on failure dump log.
          notarize() {
            local target="$1"
            local label="$2"
            if xcrun notarytool submit "$target" \
                 --key "$P8_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
                 --wait --timeout 30m; then
              return 0
            fi
            echo "::error::notarytool submit ($label) failed — fetching log"
            local sub_id
            sub_id="$(xcrun notarytool history \
              --key "$P8_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
              --output-format json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["history"][0]["id"])')"
            xcrun notarytool log "$sub_id" \
              --key "$P8_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" || true
            return 1
          }

          # ----- Round 1: notarize + staple the .app -----
          APP="$(find build -maxdepth 6 -name '*.app' -type d -print -quit)"
          if [ -z "${APP}" ]; then
            echo "::error::No .app found under build/ — briefcase output layout changed?"
            exit 1
          fi
          echo "Located .app: ${APP}"

          # notarytool accepts .zip/.dmg/.pkg — zip the .app with ditto
          # (preserves symlinks, resource forks, and code-signing metadata,
          # which plain `zip` mangles).
          APP_ZIP="$RUNNER_TEMP/app-to-notarize.zip"
          ditto -c -k --keepParent --sequesterRsrc "${APP}" "${APP_ZIP}"

          notarize "${APP_ZIP}" ".app" || { rm -f "$P8_PATH"; exit 1; }
          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"

          # ----- Build a fresh DMG containing the stapled .app -----
          # Discard briefcase's DMG (it contains the pre-staple .app copy).
          # Then hdiutil-create a new DMG from a staging directory. The
          # staging directory is *fresh* on the runner's main disk, so
          # there's plenty of free space — unlike a UDRW-converted DMG.
          APP_NAME="$(basename "${APP}")"
          STAGE="$RUNNER_TEMP/dmg-stage"

          # Belt-and-suspenders: assert STAGE is a subdirectory of
          # $RUNNER_TEMP so `rm -rf` can never expand to something bad
          # (shellcheck SC2115).
          rm -rf "${STAGE:?}"
          mkdir -p "${STAGE}"

          # ditto preserves symlinks and extended attributes correctly,
          # unlike cp -R on macOS with hard-linked files.
          ditto "${APP}" "${STAGE}/${APP_NAME}"
          ln -s /Applications "${STAGE}/Applications"

          # Volume name for the new DMG — read straight from the .app's
          # Info.plist so it matches briefcase's convention exactly
          # ("Cookie Janitor 0.8.3", not "Cookie-Janitor-universal2").
          # plutil -extract with 'raw' output gives just the value.
          VERSION="$(plutil -extract CFBundleShortVersionString raw \
            "${APP}/Contents/Info.plist")"
          VOLNAME="Cookie Janitor ${VERSION}"
          echo "New DMG volume name: ${VOLNAME}"

          rm -f "${DMG}"
          hdiutil create \
            -srcfolder "${STAGE}" \
            -volname "${VOLNAME}" \
            -format ULFO \
            -ov \
            -quiet \
            "${DMG}"

          # Sign the DMG with our Developer ID cert. hdiutil produces
          # unsigned DMGs; spctl -a -t install requires the DMG bytes
          # themselves to carry a Developer ID signature (a notarization
          # ticket alone isn't enough for Gatekeeper's install policy).
          # Signature MUST be applied BEFORE Round 2 notarize because
          # signing changes the DMG hash — otherwise the notarization
          # ticket wouldn't match the on-disk bytes.
          # --timestamp requests Apple's trusted timestamp so the
          # signature remains verifiable after the cert expires.
          codesign --sign "${IDENTITY}" --timestamp "${DMG}"
          codesign --verify --verbose=2 "${DMG}"

          # ----- Round 2: notarize + staple the new (signed) DMG -----
          notarize "${DMG}" "DMG" || { rm -f "$P8_PATH"; exit 1; }
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

          # ----- Final acceptance checks (both perspectives) -----
          spctl -a -vvv -t install "${DMG}"
          # Also verify the .app inside the finalized DMG is independently
          # launchable — the exact failure v0.8.1 hit on macOS 15.
          MOUNT="$RUNNER_TEMP/verify-mount"
          mkdir -p "${MOUNT}"
          hdiutil attach "${DMG}" -mountpoint "${MOUNT}" \
            -nobrowse -noautoopen -readonly -quiet
          spctl -a -vvv -t exec "${MOUNT}/${APP_NAME}"
          xcrun stapler validate "${MOUNT}/${APP_NAME}"
          hdiutil detach "${MOUNT}" -force -quiet

          rm -f "${P8_PATH}"

      - name: Compute SHA-256
        # SHA-256 is computed AFTER both notarization rounds, DMG
        # reconversion, and both staples — i.e. against the exact bytes
        # users will download. Any earlier hash would drift because
        # (a) hdiutil convert produces different bytes, and (b) stapler
        # embeds the ticket into the DMG.
        run: |
          cd dist
          shasum -a 256 "$(basename '${{ steps.locate.outputs.dmg }}')" \
            > "$(basename '${{ steps.locate.outputs.dmg }}').sha256"

      - name: Upload build artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keychain
        # Ephemeral keychain lives only for the duration of this job.
        # `if: always()` ensures cleanup runs even if signing or
        # notarization failed, so no cert material lingers.
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

  build-windows:
    name: Build Windows MSI (${{ matrix.arch }})
    # Run in parallel with build-macos. Briefcase Windows packaging
    # requires WiX Toolset v3 plus a native Python — we cannot
    # cross-build Windows from macOS or Linux. The runner IS the
    # target platform.
    #
    # Windows has no "universal binary" concept (unlike macOS Mach-O),
    # so we build two MSIs — one per architecture — on two runners:
    #
    #   * windows-latest      -> x64  MSI  (WiX + native x64 Python)
    #   * windows-11-arm      -> arm64 MSI (WiX + native arm64 Python)
    #
    # This matches how Chrome / Edge / VS Code / most Python apps
    # distribute on Windows. Windows-on-ARM users get a native binary
    # instead of the x64-through-emulation fallback.
    #
    # If the windows-11-arm runner label is unavailable in your
    # GitHub plan (rare — public repos have had free access since
    # 2025), remove the arm64 matrix cell and users will fall back
    # to x64 emulation, which is transparent on Windows 11.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (dev + gui)
        run: uv sync --extra dev --extra gui --frozen

      - name: Install briefcase
        run: uv pip install "briefcase>=0.3.20,<0.4"

      - name: Ensure WiX toolset is available
        # WiX 3.x ships preinstalled on windows-latest but NOT on
        # windows-11-arm. On arm64 runners we install it via
        # Chocolatey — WiX itself is a set of x86 binaries that run
        # fine on arm64 Windows via the built-in x86 emulator (WiX
        # generates architecture-neutral MSI databases; the payload
        # arch is set by briefcase from the runner's native Python).
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            Write-Host "candle.exe not on PATH; installing WiX 3.x via Chocolatey..."
            choco install wixtoolset --version 3.14.1 --no-progress -y
            # Chocolatey drops WiX into "C:\Program Files (x86)\WiX Toolset v3.14\bin".
            $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
            if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
              Write-Error "WiX install did not produce candle.exe at $wixBin"
              exit 1
            }
            "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$wixBin;$env:PATH"
          }
          candle.exe -? | Select-Object -First 1

      - name: Briefcase create + build
        run: |
          uv run briefcase create windows app --no-input
          uv run briefcase build windows app --no-input

      - name: Briefcase package (ad-hoc / unsigned MSI)
        # Without a code-signing certificate the MSI is unsigned and
        # SmartScreen will warn on first launch (analogous to macOS
        # Gatekeeper). We surface this clearly in the release body.
        # When AZURE_CODE_SIGNING_* secrets become available, this is
        # the spot to add `--identity` or a SignTool step.
        run: uv run briefcase package windows app --adhoc-sign --no-input

      - name: Locate built MSI
        id: locate
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI produced by briefcase"
            exit 1
          }
          $renamed = "dist\Cookie-Janitor-${{ matrix.arch }}.msi"
          Move-Item -Path $msi.FullName -Destination $renamed
          "msi=$renamed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $msiPath = "${{ steps.locate.outputs.msi }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $msiPath).Hash.ToLower()
          $name = Split-Path -Leaf $msiPath
          # Match the macOS format: "<hash>  <filename>" — two spaces,
          # lowercase hex — so the same verify command works on both
          # platforms (`shasum -c` on Mac, `Get-FileHash` on Windows).
          "$hash  $name" | Out-File -FilePath "$msiPath.sha256" -Encoding ASCII -NoNewline

      - name: Upload build artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` — softprops/action-gh-release needs it to create
      # the draft release and upload assets.
      contents: write
      # `id-token: write` + `attestations: write` — required by
      # actions/attest-build-provenance to obtain an OIDC token from
      # GitHub's issuer and record the resulting Sigstore bundle in the
      # repo's attestations index. Least-privilege: only this job gets
      # these permissions; the build jobs do not.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download all macOS artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artefacts
          pattern: macos-*
          merge-multiple: true

      - name: Download all Windows artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artefacts
          pattern: windows-*
          merge-multiple: true

      - name: Assemble release directory
        run: |
          mkdir -p release
          cp artefacts/*.dmg release/
          cp artefacts/*.dmg.sha256 release/
          cp artefacts/*.msi release/
          cp artefacts/*.msi.sha256 release/
          ls -la release/

      - name: Generate SLSA build provenance attestations
        # Records a Sigstore-signed attestation, published to GitHub's
        # public attestations index, proving each installer was built
        # from this specific commit by this specific workflow run.
        # Users verify with:
        #
        #   gh attestation verify Cookie-Janitor-universal2.dmg \
        #     --repo sgireddy/cookie-janitor
        #
        # Only the three shippable installers are subjects — .sha256
        # sidecars are user-verifiable against the DMG/MSI themselves,
        # so attesting them separately would be redundant noise in the
        # public transparency log.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            release/Cookie-Janitor-universal2.dmg
            release/Cookie-Janitor-x64.msi
            release/Cookie-Janitor-arm64.msi

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag_name || 'preview' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Cookie Janitor ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.dmg.sha256
            release/*.msi
            release/*.msi.sha256
          body: |
            ## Cookie Janitor ${{ steps.tag.outputs.name }}

            Pick your platform:

            * **macOS 11+ (Intel + Apple Silicon, universal)** —
              `Cookie-Janitor-universal2.dmg`
              Single DMG runs natively on both architectures.
            * **Windows 10 / 11 (x64)** — `Cookie-Janitor-x64.msi`
            * **Windows 11 (arm64)** — `Cookie-Janitor-arm64.msi`
              Native arm64 build for Surface Pro X / Copilot+ PCs.
              (x64 users on ARM Windows can still run the x64 MSI
              via the built-in emulator, but the arm64 MSI is
              faster and uses less battery.)

            ### First-launch warnings

            **macOS** — no warning. The DMG is signed with a
            Developer ID Application certificate and notarized by
            Apple. Gatekeeper verifies the signature and Apple's
            notarization ticket on first launch, so double-clicking
            Cookie Janitor.app just works. You can confirm the
            signature yourself:

            ```sh
            codesign -dv --verbose=2 /Applications/Cookie\ Janitor.app
            spctl -a -vvv -t install Cookie-Janitor-universal2.dmg
            ```

            **Windows** — "Windows protected your PC" (SmartScreen):
            1. Click **More info** in the blue dialog.
            2. Click **Run anyway**.

            The Windows MSI is not yet signed with an EV code-signing
            certificate; SmartScreen builds reputation over downloads
            and this warning disappears once enough users install a
            given version.

            ### Verify your download

            Every artefact ships with a matching `.sha256` file
            containing its SHA-256 hash in `<hash>  <filename>` format,
            so the same shape works on both platforms:

            ```sh
            # macOS / Linux
            shasum -a 256 -c Cookie-Janitor-universal2.dmg.sha256
            ```

            ```powershell
            # Windows (x64 example — swap in arm64 as needed)
            $expected = (Get-Content Cookie-Janitor-x64.msi.sha256).Split()[0]
            $actual   = (Get-FileHash Cookie-Janitor-x64.msi).Hash.ToLower()
            if ($expected -eq $actual) { "OK" } else { "MISMATCH" }
            ```

            ### Verify the build provenance (SLSA)

            Every installer in this release is cryptographically
            attested by GitHub Actions. The attestation proves the
            binary was built from a specific commit by a specific
            workflow run in this repository, using Sigstore's
            keyless-signing infrastructure. This is stronger than
            the SHA-256 above — it verifies **who built the file
            and from what source**, not just that the bytes match.

            Requires the [GitHub CLI](https://cli.github.com/):

            ```sh
            gh attestation verify Cookie-Janitor-universal2.dmg \
              --repo ${{ github.repository }}
            ```

            Expected output includes:

            ```
            ✓ Verification succeeded!
            ```

            If verification fails, do not run the installer — treat it
            as a supply-chain compromise and open an issue.

            ### Source

            Built from commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
            Every line of source is on GitHub — there are no
            closed-source components in either binary.
