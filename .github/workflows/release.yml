name: Release

# Build the macOS .app + .dmg for tagged releases (`v*`), and also on a
# manual workflow_dispatch so we can produce unsigned development builds
# without cutting a tag.
#
# What this workflow guarantees today:
#   * One DMG per macOS arch (arm64 + x86_64), built on the matching
#     runner so the bundled Qt binaries are native.
#   * SHA-256 sums published next to the DMGs so users can verify what
#     they downloaded matches what CI produced.
#   * A draft GitHub Release is created on tag pushes; a maintainer
#     publishes it after a quick smoke test.
#
# What this workflow does NOT do yet (tracked):
#   * Code-signing with a Developer ID Application certificate. Without
#     it macOS Gatekeeper will require a right-click → Open the first
#     time. We surface this clearly in the release notes.
#   * Notarisation. Same reason. We will add both once a signing
#     identity is available and stored in repo secrets as
#     APPLE_CERTIFICATE_P12 / APPLE_CERTIFICATE_PASSWORD / TEAM_ID etc.
#
# The workflow only writes inside the runner. The single write outside
# the runner is `softprops/action-gh-release`, which requires the
# default GITHUB_TOKEN with `contents: write` — declared explicitly.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name for the resulting draft release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # If a newer release run for the same ref starts, abandon the older one.
  # Releases are idempotent (artifacts are derived from the ref, draft
  # release is upserted by tag_name) so superseding is safe and avoids
  # the queue-pileup we saw when an Intel runner sat queued for hours.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = Apple Silicon (arm64) hosted runner. From this
          # single runner we build a **universal2** DMG that contains
          # both arm64 AND x86_64 slices in one Mach-O fat binary — so
          # Intel Macs (2017–2019 MacBook Pros, 2020 iMacs, etc.) and
          # every Apple Silicon Mac run the same artefact.
          #
          # Mechanism: Briefcase reads `pyproject.toml`'s
          # `[tool.briefcase.app.cookie_janitor.macOS] universal_build`
          # setting, which we don't set to True permanently (universal2
          # doubles compile time on developer laptops). Instead we flip
          # it via the BRIEFCASE_MACOS_APP_UNIVERSAL_BUILD env var only
          # in CI. This is the same knob scripts/build-mac-dmg.sh uses
          # locally on the Intel Mac (host `mac`).
          #
          # We no longer need the macos-13 (Intel) runner — universal2
          # from macos-14 covers Intel too, and macos-13 is being
          # retired by GitHub in any case.
          - runner: macos-14
            arch: universal2
    runs-on: ${{ matrix.runner }}
    env:
      # Flip briefcase's macOS backend into universal2 mode. Overrides
      # pyproject.toml at build time; no permanent file change needed.
      BRIEFCASE_MACOS_APP_UNIVERSAL_BUILD: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0  # briefcase reads tags for version metadata

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (dev + gui)
        run: uv sync --extra dev --extra gui --frozen

      - name: Install briefcase
        run: uv pip install "briefcase>=0.3.20,<0.4"

      - name: Briefcase create + build
        run: |
          uv run briefcase create macOS app --no-input
          uv run briefcase build macOS app --no-input

      - name: Briefcase package (ad-hoc signed DMG)
        # `--adhoc-sign` is the documented way to produce an unsigned-
        # but-launchable bundle for users who right-click → Open. CI
        # will switch to a real `--identity` once a Developer ID is
        # provisioned (see TODO at top of file).
        run: uv run briefcase package macOS app --adhoc-sign --no-input

      - name: Locate built DMG
        id: locate
        run: |
          set -euo pipefail
          dmg="$(find dist -name '*.dmg' -print -quit)"
          if [ -z "${dmg}" ]; then
            echo "No DMG produced by briefcase" >&2
            exit 1
          fi
          renamed="dist/Cookie-Janitor-${{ matrix.arch }}.dmg"
          mv "${dmg}" "${renamed}"
          echo "dmg=${renamed}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256
        run: |
          cd dist
          shasum -a 256 "$(basename '${{ steps.locate.outputs.dmg }}')" \
            > "$(basename '${{ steps.locate.outputs.dmg }}').sha256"

      - name: Upload build artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows MSI (${{ matrix.arch }})
    # Run in parallel with build-macos. Briefcase Windows packaging
    # requires WiX Toolset v3 plus a native Python — we cannot
    # cross-build Windows from macOS or Linux. The runner IS the
    # target platform.
    #
    # Windows has no "universal binary" concept (unlike macOS Mach-O),
    # so we build two MSIs — one per architecture — on two runners:
    #
    #   * windows-latest      -> x64  MSI  (WiX + native x64 Python)
    #   * windows-11-arm      -> arm64 MSI (WiX + native arm64 Python)
    #
    # This matches how Chrome / Edge / VS Code / most Python apps
    # distribute on Windows. Windows-on-ARM users get a native binary
    # instead of the x64-through-emulation fallback.
    #
    # If the windows-11-arm runner label is unavailable in your
    # GitHub plan (rare — public repos have had free access since
    # 2025), remove the arm64 matrix cell and users will fall back
    # to x64 emulation, which is transparent on Windows 11.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (dev + gui)
        run: uv sync --extra dev --extra gui --frozen

      - name: Install briefcase
        run: uv pip install "briefcase>=0.3.20,<0.4"

      - name: Ensure WiX toolset is available
        # WiX 3.x ships preinstalled on windows-latest but NOT on
        # windows-11-arm. On arm64 runners we install it via
        # Chocolatey — WiX itself is a set of x86 binaries that run
        # fine on arm64 Windows via the built-in x86 emulator (WiX
        # generates architecture-neutral MSI databases; the payload
        # arch is set by briefcase from the runner's native Python).
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            Write-Host "candle.exe not on PATH; installing WiX 3.x via Chocolatey..."
            choco install wixtoolset --version 3.14.1 --no-progress -y
            # Chocolatey drops WiX into "C:\Program Files (x86)\WiX Toolset v3.14\bin".
            $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
            if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
              Write-Error "WiX install did not produce candle.exe at $wixBin"
              exit 1
            }
            "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$wixBin;$env:PATH"
          }
          candle.exe -? | Select-Object -First 1

      - name: Briefcase create + build
        run: |
          uv run briefcase create windows app --no-input
          uv run briefcase build windows app --no-input

      - name: Briefcase package (ad-hoc / unsigned MSI)
        # Without a code-signing certificate the MSI is unsigned and
        # SmartScreen will warn on first launch (analogous to macOS
        # Gatekeeper). We surface this clearly in the release body.
        # When AZURE_CODE_SIGNING_* secrets become available, this is
        # the spot to add `--identity` or a SignTool step.
        run: uv run briefcase package windows app --adhoc-sign --no-input

      - name: Locate built MSI
        id: locate
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI produced by briefcase"
            exit 1
          }
          $renamed = "dist\Cookie-Janitor-${{ matrix.arch }}.msi"
          Move-Item -Path $msi.FullName -Destination $renamed
          "msi=$renamed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $msiPath = "${{ steps.locate.outputs.msi }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $msiPath).Hash.ToLower()
          $name = Split-Path -Leaf $msiPath
          # Match the macOS format: "<hash>  <filename>" — two spaces,
          # lowercase hex — so the same verify command works on both
          # platforms (`shasum -c` on Mac, `Get-FileHash` on Windows).
          "$hash  $name" | Out-File -FilePath "$msiPath.sha256" -Encoding ASCII -NoNewline

      - name: Upload build artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` — softprops/action-gh-release needs it to create
      # the draft release and upload assets.
      contents: write
      # `id-token: write` + `attestations: write` — required by
      # actions/attest-build-provenance to obtain an OIDC token from
      # GitHub's issuer and record the resulting Sigstore bundle in the
      # repo's attestations index. Least-privilege: only this job gets
      # these permissions; the build jobs do not.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Download all macOS artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artefacts
          pattern: macos-*
          merge-multiple: true

      - name: Download all Windows artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artefacts
          pattern: windows-*
          merge-multiple: true

      - name: Assemble release directory
        run: |
          mkdir -p release
          cp artefacts/*.dmg release/
          cp artefacts/*.dmg.sha256 release/
          cp artefacts/*.msi release/
          cp artefacts/*.msi.sha256 release/
          ls -la release/

      - name: Generate SLSA build provenance attestations
        # Records a Sigstore-signed attestation, published to GitHub's
        # public attestations index, proving each installer was built
        # from this specific commit by this specific workflow run.
        # Users verify with:
        #
        #   gh attestation verify Cookie-Janitor-universal2.dmg \
        #     --repo sgireddy/cookie-janitor
        #
        # Only the three shippable installers are subjects — .sha256
        # sidecars are user-verifiable against the DMG/MSI themselves,
        # so attesting them separately would be redundant noise in the
        # public transparency log.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            release/Cookie-Janitor-universal2.dmg
            release/Cookie-Janitor-x64.msi
            release/Cookie-Janitor-arm64.msi

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag_name || 'preview' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Cookie Janitor ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.dmg.sha256
            release/*.msi
            release/*.msi.sha256
          body: |
            ## Cookie Janitor ${{ steps.tag.outputs.name }}

            Pick your platform:

            * **macOS 11+ (Intel + Apple Silicon, universal)** —
              `Cookie-Janitor-universal2.dmg`
              Single DMG runs natively on both architectures.
            * **Windows 10 / 11 (x64)** — `Cookie-Janitor-x64.msi`
            * **Windows 11 (arm64)** — `Cookie-Janitor-arm64.msi`
              Native arm64 build for Surface Pro X / Copilot+ PCs.
              (x64 users on ARM Windows can still run the x64 MSI
              via the built-in emulator, but the arm64 MSI is
              faster and uses less battery.)

            ### First-launch warnings

            Neither binary is signed with a paid OS-vendor certificate
            yet, so each operating system shows a one-time warning
            until you tell it you trust the download:

            **macOS** — "unidentified developer":
            1. Right-click `Cookie Janitor.app` in Applications.
            2. Choose **Open**.
            3. Click **Open** in the dialog that appears.

            **Windows** — "Windows protected your PC" (SmartScreen):
            1. Click **More info** in the blue dialog.
            2. Click **Run anyway**.

            Each step happens only the first time per machine.

            ### Verify your download

            Every artefact ships with a matching `.sha256` file
            containing its SHA-256 hash in `<hash>  <filename>` format,
            so the same shape works on both platforms:

            ```sh
            # macOS / Linux
            shasum -a 256 -c Cookie-Janitor-universal2.dmg.sha256
            ```

            ```powershell
            # Windows (x64 example — swap in arm64 as needed)
            $expected = (Get-Content Cookie-Janitor-x64.msi.sha256).Split()[0]
            $actual   = (Get-FileHash Cookie-Janitor-x64.msi).Hash.ToLower()
            if ($expected -eq $actual) { "OK" } else { "MISMATCH" }
            ```

            ### Verify the build provenance (SLSA)

            Every installer in this release is cryptographically
            attested by GitHub Actions. The attestation proves the
            binary was built from a specific commit by a specific
            workflow run in this repository, using Sigstore's
            keyless-signing infrastructure. This is stronger than
            the SHA-256 above — it verifies **who built the file
            and from what source**, not just that the bytes match.

            Requires the [GitHub CLI](https://cli.github.com/):

            ```sh
            gh attestation verify Cookie-Janitor-universal2.dmg \
              --repo ${{ github.repository }}
            ```

            Expected output includes:

            ```
            ✓ Verification succeeded!
            ```

            If verification fails, do not run the installer — treat it
            as a supply-chain compromise and open an issue.

            ### Source

            Built from commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
            Every line of source is on GitHub — there are no
            closed-source components in either binary.
